name: Search 成长100 in Tushare

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tushare pandas

      - name: Search 成长100 in Tushare
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python3 - <<'EOF'
          import tushare as ts
          import os

          pro = ts.pro_api(os.environ["TUSHARE_TOKEN"])

          for market in ['MSCI', 'CSI', 'SSE', 'SZSE', 'CICC', 'SW', 'OTH']:
              try:
                  df = pro.index_basic(market=market)
                  result = df[df['name'].str.contains('成长100', na=False)]
                  if not result.empty:
                      print(f"=== 找到了！market={market} ===")
                      print(result[['ts_code', 'name', 'market', 'list_date']])
              except Exception as e:
                  print(f"market={market} 报错: {e}")
          EOF
