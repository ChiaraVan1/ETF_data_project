name: Get 成长100 PE via ETF

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tushare pandas

      - name: Get ETF info and benchmark
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python3 - <<'EOF'
          import tushare as ts
          import os

          pro = ts.pro_api(os.environ["TUSHARE_TOKEN"])

          # 查 ETF 基本信息，确认 benchmark 字段
          df = pro.fund_basic(market='E')
          etf = df[df['ts_code'] == '159259.SZ']
          print("=== ETF 基本信息 ===")
          print(etf.T)

          # 查跟踪指数的 ts_code
          benchmark = etf['benchmark'].values[0] if not etf.empty else None
          print(f"\nbenchmark: {benchmark}")

          # 尝试用 benchmark 查指数 PE
          for market in ['MSCI', 'CSI', 'SSE', 'SZSE', 'CICC', 'SW', 'OTH']:
              try:
                  idx = pro.index_basic(market=market)
                  result = idx[idx['name'].str.contains('成长100', na=False)]
                  if not result.empty:
                      print(f"\n找到指数 market={market}:")
                      print(result[['ts_code', 'name']].to_string())
              except:
                  pass
          EOF
